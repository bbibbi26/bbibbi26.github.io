<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냐/삐용</title>
    <style>
        :root {
            --main-pink: #ff7eb9;
            --soft-pink: #ffe4f1;
            --cyber-white: #ffffff;
            --accent-blue: #70d6ff;
        }

        /* 1. 커서 설정: 모든 곳에서 기본 커서 숨김 */
        * { cursor: none !important; }

        body {
            background-color: var(--soft-pink);
            background-image: 
                radial-gradient(circle at 50% 50%, #ffffff 0%, #ffe4f1 100%),
                linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--main-pink);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* --- 커스텀 커서 --- */
        #custom-cursor {
            width: 20px;
            height: 20px;
            border: 2px solid var(--main-pink);
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px var(--main-pink);
            transition: transform 0.15s ease-out, width 0.2s, height 0.2s;
        }
        #custom-cursor::after {
            content: '';
            width: 4px; height: 4px;
            background: var(--accent-blue);
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
        }

        /* --- 로딩 화면 --- */
        #loading-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--soft-pink);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 1s ease-out;
        }
        .loader-box { width: 300px; text-align: left; }
        .loader-bar {
            width: 0%; height: 4px;
            background: var(--main-pink);
            box-shadow: 0 0 15px var(--main-pink);
            margin: 15px 0;
        }
        .loading-text { font-size: 0.9rem; letter-spacing: 2px; height: 20px; }

        /* --- 로그인 프레임 --- */
        .login-frame {
            display: none;
            position: relative;
            width: 380px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--main-pink);
            box-shadow: 0 0 20px rgba(255, 126, 185, 0.3);
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 88%, 88% 100%, 0 100%);
            backdrop-filter: blur(10px);
            animation: fadeIn 1s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .top-accent {
            position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: linear-gradient(90deg, var(--main-pink), var(--accent-blue));
        }

        h1 {
            font-size: 3rem; font-weight: 900; margin-bottom: 40px;
            letter-spacing: 10px; color: var(--main-pink);
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px var(--accent-blue);
            animation: glitch-anim 3s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: none; }
            5% { transform: skew(2deg); opacity: 0.8; }
            10% { transform: none; }
            100% { transform: none; }
        }

        input {
            width: 100%; background: #fff; border: 1px solid var(--main-pink);
            padding: 15px; color: var(--main-pink); font-size: 1.1rem;
            text-align: center; outline: none; box-sizing: border-box;
            border-bottom: 4px solid var(--main-pink);
        }

        button {
            width: 100%; margin-top: 20px; padding: 15px; background: var(--main-pink);
            border: none; color: #fff; font-size: 1.1rem; font-weight: bold;
            letter-spacing: 5px; cursor: none; transition: 0.3s;
            clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
        }
        button:hover { background: #ff50a0; box-shadow: 0 0 20px rgba(255, 126, 185, 0.6); }

        .footer-info { margin-top: 30px; font-size: 0.75rem; color: var(--main-pink); display: flex; justify-content: space-between; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="custom-cursor"></div>

    <div id="loading-screen">
        <div class="loader-box">
            <div class="loading-text" id="status-msg">SYSTEM BOOTING...</div>
            <div class="loader-bar" id="progress-bar"></div>
            <div class="loading-text" id="percent">0%</div>
        </div>
    </div>

    <div class="login-frame" id="login-content">
        <div class="top-accent"></div>
        <h1>냥뿅</h1>
        <input type="password" id="passcode" placeholder="PASSCODE_REQUIRED">
        <button onclick="validateAccess()">ENTER SYSTEM</button>
        <div class="footer-info">
            <span>UNIT: NYA-PPI</span>
            <span>SECURE_MODE: ON</span>
        </div>
    </div>

    <script>
        // 1. 커서 이동 스크립트
        const cursor = document.getElementById('custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // 커서 반응 (버튼/입력창)
        const interactiveElements = document.querySelectorAll('button, input');
        interactiveElements.forEach(el => {
            el.addEventListener('mouseenter', () => {
                cursor.style.width = '40px';
                cursor.style.height = '40px';
                cursor.style.background = 'rgba(255, 126, 185, 0.1)';
            });
            el.addEventListener('mouseleave', () => {
                cursor.style.width = '20px';
                cursor.style.height = '20px';
                cursor.style.background = 'transparent';
            });
        });

        // 2. 로딩 애니메이션
        const messages = ["섹시코테의 머리칼을 빗어주는 중...", "환상의 옷장 정리중...", "엉킨 꼬리털 풀어내는 중...", "마지막으로 외모체크", "놀 준비 완료"];
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const percentText = document.getElementById('percent');
        const statusMsg = document.getElementById('status-msg');

        const loadingInterval = setInterval(() => {
            progress += Math.floor(Math.random() * 12) + 4;
            if (progress >= 100) {
                progress = 100;
                clearInterval(loadingInterval);
                finishLoading();
            }
            progressBar.style.width = progress + "%";
            percentText.innerText = progress + "%";
            statusMsg.innerText = messages[Math.floor((progress/100) * (messages.length-1))];
        }, 300);

        function finishLoading() {
            setTimeout(() => {
                const ls = document.getElementById('loading-screen');
                ls.style.opacity = '0';
                setTimeout(() => {
                    ls.style.display = 'none';
                    document.getElementById('login-content').style.display = 'block';
                }, 1000);
            }, 500);
        }

        // 3. 접속 확인
        function validateAccess() {
            const pass = document.getElementById('passcode').value;
            if(pass === "1234") {
                alert("ACCESS GRANTED.");
                location.href = "main.html";
            } else {
                alert("DENIED.");
            }
        }
    </script>
</body>
</html>
