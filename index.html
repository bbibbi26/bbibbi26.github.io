<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냐/삐용</title>
    <style>
        :root {
            --neon-blue: #00f3ff;
            --neon-purple: #bc00ff;
            --bg-dark: #050508;
            --glow-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        body {
            background-color: var(--bg-dark);
            /* 배경 노이즈 및 스캔라인 효과 */
            background-image: 
                radial-gradient(circle at 50% 50%, #10002b 0%, #050508 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03), rgba(188, 0, 255, 0.03));
            background-size: 100% 100%, 100% 4px, 4px 100%;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 메인 프레임: 각진 디자인 (오른쪽 아래 절삭) */
        .login-frame {
            position: relative;
            width: 380px;
            padding: 50px 40px;
            background: rgba(10, 10, 20, 0.8);
            border: 1px solid var(--neon-blue);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.2), inset 0 0 15px rgba(188, 0, 255, 0.1);
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 88%, 88% 100%, 0 100%);
            backdrop-filter: blur(5px);
        }

        /* 상단 네온 바 */
        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
            box-shadow: 0 0 15px var(--neon-blue);
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: 8px;
            text-transform: uppercase;
            color: #fff;
            /* 블루와 퍼플이 섞인 글리치 효과 */
            text-shadow: 
                -2px -2px 0 var(--neon-blue),
                2px 2px 0 var(--neon-purple);
            animation: glitch-anim 4s infinite;
        }

        @keyframes glitch-anim {
            0% { text-shadow: -2px -2px 0 var(--neon-blue), 2px 2px 0 var(--neon-purple); }
            1% { text-shadow: 3px 1px 0 var(--neon-blue), -3px -1px 0 var(--neon-purple); transform: skew(2deg); }
            2% { text-shadow: -2px -2px 0 var(--neon-blue), 2px 2px 0 var(--neon-purple); transform: skew(0deg); }
            100% { text-shadow: -2px -2px 0 var(--neon-blue), 2px 2px 0 var(--neon-purple); }
        }

        .input-box {
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #333;
            padding: 15px;
            color: var(--neon-blue);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            border-left: 4px solid var(--neon-blue);
        }

        input:focus {
            border-color: var(--neon-purple);
            border-left: 4px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(188, 0, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--neon-purple);
            color: var(--neon-purple);
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        button:hover {
            background: var(--neon-purple);
            color: #000;
            box-shadow: 0 0 30px var(--neon-purple);
        }

        .footer-info {
            margin-top: 30px;
            font-size: 0.7rem;
            color: #444;
            display: flex;
            justify-content: space-between;
            letter-spacing: 1px;
        }

        /* 배경 데코레이션 레이어 */
        .bg-grid {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(188, 0, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(188, 0, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -1;
        }
    </style>
    <script>
        function validateAccess() {
            const pass = document.getElementById('passcode').value;
            if(pass === "1234") {
                alert("IDENTITY CONFIRMED. REDIRECTING...");
                location.href = "main.html";
            } else {
                alert("ACCESS DENIED: UNKNOWN SIGNATURE");
            }
        }
    </script>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="login-frame">
        <div class="top-accent"></div>
        <h1>냥뿅</h1>
        
        <div class="input-box">
            <input type="password" id="passcode" placeholder="ENTER PASSCODE">
        </div>
        
        <button onclick="validateAccess()">SYSTEM LOGIN</button>

        <div class="footer-info">
            <span>PROJECT: NYA-PPI</span>
            <span>STATUS: ENCRYPTED</span>
        </div>
    </div>

</body>
</html>
