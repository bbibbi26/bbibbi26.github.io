<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYA-PPI / INTEGRATED_TERMINAL</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    
    <style>
        :root {
            --main-pink: #ff7eb9;
            --main-purple: #9d00ff;
            --dark-bg: #050508;
            --panel-bg: rgba(15, 15, 25, 0.8);
            --accent-blue: #00f3ff;
            --font-main: 'GmarketSansBold', sans-serif;
            --font-light: 'GmarketSansLight', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.1) 0%, transparent 80%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #fff;
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- 거대한 통합 터미널 박스 --- */
        .terminal-frame {
            width: 90vw;
            height: 85vh;
            max-width: 1200px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 126, 185, 0.3);
            border-radius: 60px 20px 60px 20px; /* 기존 곡률 계승 */
            backdrop-filter: blur(25px);
            display: flex;
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(157, 0, 255, 0.1);
            overflow: hidden;
            animation: terminalOpen 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes terminalOpen {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* 상단 네온 라인 인디케이터 */
        .terminal-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--main-pink), var(--main-purple), transparent);
            box-shadow: 0 0 15px var(--main-pink);
            z-index: 10;
        }

        /* --- 왼쪽 사이드 바 (구분선으로 분리) --- */
        .sidebar {
            width: 300px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            padding: 40px;
            background: rgba(0, 0, 0, 0.2);
        }

        .profile-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .profile-hex {
            width: 100px; height: 100px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--main-pink), var(--main-purple));
            border-radius: 30px 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 3rem;
            box-shadow: 0 0 20px rgba(255, 126, 185, 0.4);
        }

        .user-info h3 { margin: 0; font-size: 1.4rem; letter-spacing: 1px; }
        .user-info p { font-family: var(--font-light); font-size: 0.75rem; color: var(--accent-blue); margin: 5px 0; }

        .nav-menu {
            list-style: none; padding: 0; margin: 0;
            flex-grow: 1;
        }

        .nav-item {
            padding: 15px 20px;
            margin-bottom: 10px;
            border-radius: 10px 20px;
            cursor: pointer;
            font-family: var(--font-light);
            transition: 0.3s;
            color: rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .nav-item:hover {
            background: rgba(255, 126, 185, 0.1);
            color: var(--main-pink);
            transform: translateX(5px);
        }

        .nav-item.active {
            background: linear-gradient(90deg, rgba(157, 0, 255, 0.2), transparent);
            border-left: 3px solid var(--main-purple);
            color: #fff;
        }

        /* --- 오른쪽 메인 콘텐츠 영역 --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 50px;
            overflow-y: auto;
        }

        .header-banner {
            margin-bottom: 40px;
        }

        .header-banner h2 { 
            font-size: 2.8rem; margin: 0; 
            background: linear-gradient(90deg, #fff, var(--main-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .system-status {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .status-tag {
            padding: 5px 15px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 20px;
            font-size: 0.7rem;
            color: var(--accent-blue);
            font-family: var(--font-light);
        }

        /* 그리드 메뉴 */
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .action-card {
            height: 160px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 30px;
            cursor: pointer;
            transition: 0.3s;
            position: relative;
        }

        .action-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--main-pink);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .action-card i { font-size: 2.5rem; margin-bottom: 10px; }
        .action-card span { font-size: 1.1rem; letter-spacing: 1px; }

        /* 카드 내부 장식 */
        .action-card::after {
            content: '>>';
            position: absolute;
            right: 30px;
            bottom: 30px;
            font-size: 0.8rem;
            color: var(--main-pink);
            opacity: 0.3;
        }

        /* 로그아웃 섹션 */
        .footer-info {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .disconnect-btn {
            font-family: var(--font-light);
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
        }

        .disconnect-btn:hover { color: var(--main-pink); }

        /* 스크롤바 디자인 */
        .main-content::-webkit-scrollbar { width: 5px; }
        .main-content::-webkit-scrollbar-thumb { background: var(--main-purple); border-radius: 10px; }
    </style>
</head>
<body>
