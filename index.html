<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냐/삐용</title>
    <style>
        :root {
            --main-pink: #ff7eb9;
            --soft-pink: #ffe4f1;
            --cyber-white: #ffffff;
            --accent-blue: #70d6ff; /* 대비를 위한 포인트 컬러 */
        }

        body {
            background-color: var(--soft-pink);
            /* 밝은 배경에도 사이버틱한 패턴 추가 */
            background-image: 
                radial-gradient(circle at 50% 50%, #ffffff 0%, #ffe4f1 100%),
                linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--main-pink);
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 메인 프레임: 밝은 화이트 배경에 핑크 네온 테두리 */
        .login-frame {
            position: relative;
            width: 380px;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid var(--main-pink);
            box-shadow: 0 0 20px rgba(255, 126, 185, 0.3);
            text-align: center;
            /* 사이버펑크 특유의 각진 모서리 */
            clip-path: polygon(0 0, 100% 0, 100% 88%, 88% 100%, 0 100%);
            backdrop-filter: blur(10px);
        }

        /* 상단 네온 바 */
        .top-accent {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, var(--main-pink), var(--accent-blue));
        }

        h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 40px;
            letter-spacing: 10px;
            color: var(--main-pink);
            text-transform: uppercase;
            /* 핑크 & 화이트 글리치 효과 */
            text-shadow: 
                2px 2px 0px #fff,
                -2px -2px 0px var(--accent-blue);
            animation: glitch-anim 3s infinite;
        }

        @keyframes glitch-anim {
            0% { transform: none; opacity: 1; }
            7% { transform: skew(-0.5deg, -0.9deg); opacity: 0.75; }
            10% { transform: none; opacity: 1; }
            27% { transform: none; opacity: 1; }
            30% { transform: skew(0.8deg, -0.1deg); opacity: 0.75; }
            35% { transform: none; opacity: 1; }
            100% { transform: none; opacity: 1; }
        }

        input {
            width: 100%;
            background: #fff;
            border: 1px solid var(--main-pink);
            padding: 15px;
            color: var(--main-pink);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: 0.3s;
            box-sizing: border-box;
            border-bottom: 4px solid var(--main-pink);
        }

        input:focus {
            background: var(--soft-pink);
            box-shadow: 0 0 15px rgba(255, 126, 185, 0.4);
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: var(--main-pink);
            border: none;
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 5px;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(0 0, 95% 0, 100% 30%, 100% 100%, 5% 100%, 0 70%);
        }

        button:hover {
            background: #ff50a0;
            box-shadow: 0 0 20px rgba(255, 126, 185, 0.6);
            transform: translateY(-2px);
        }

        .footer-info {
            margin-top: 30px;
            font-size: 0.75rem;
            color: var(--main-pink);
            display: flex;
            justify-content: space-between;
            opacity: 0.7;
        }
    </style>
    <script>
        function validateAccess() {
            const pass = document.getElementById('passcode').value;
            if(pass === "1234") {
                alert("ACCESS GRANTED.");
                location.href = "main.html";
            } else {
                alert("DENIED.");
            }
        }
    </script>
</head>
<body>

    <div class="login-frame">
        <div class="top-accent"></div>
        <h1>냥뿅</h1>
        
        <input type="password" id="passcode" placeholder="PASSCODE_REQUIRED">
        
        <button onclick="validateAccess()">ENTER SYSTEM</button>

        <div class="footer-info">
            <span>UNIT: NYA-PPI</span>
            <span>SECURE_MODE</span>
        </div>
    </div>

</body>
</html>
