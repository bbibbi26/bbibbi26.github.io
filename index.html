<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYA-PPI / INTRO_GATE</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f0f7; /* 화사하고 포근한 라이트 라벤더 그레이 배경 */
            --main-pink: #ff8fab; 
            --main-purple: #9d7cff; 
            --accent-blue: #5bc0eb;
            --text-color: #4a4556;
            --font-main: 'GmarketSansBold', sans-serif;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--text-color); font-family: var(--font-main); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .gate-frame { width: 320px; text-align: center; }
        .logo-area { font-size: 1.2rem; color: #6c5ce7; text-shadow: 0 2px 10px rgba(108, 92, 231, 0.15); margin-bottom: 20px; }
        .logo-sub { font-size: 0.6rem; opacity: 0.5; margin-top: 5px; }
        #gate-loader { font-family: 'Courier New', monospace; font-size: 11px; color: var(--main-purple); }
        .gate-btn-container { display: flex; flex-direction: column; gap: 15px; width: 220px; margin: 0 auto; opacity: 0; transition: opacity 0.5s ease-in; }
        .gate-btn { padding: 12px 10px; border: 1px solid rgba(108, 92, 231, 0.2); border-radius: 8px; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; color: var(--text-color); font-family: var(--font-main); letter-spacing: 1px; transition: 0.3s; background: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .gate-btn:hover { background: #6c5ce7; color: #fff; border-color: #6c5ce7; box-shadow: 0 6px 15px rgba(108, 92, 231, 0.3); }
    </style>
</head>
<body>
    <div class="gate-frame">
        <div class="logo-area">
            <div>Nya-Ppi Space</div>
            <div class="logo-sub">> COZY_CONNECTION_HUB</div>
        </div>
        <div id="gate-loader">CONNECTING_TO_DATABASE...</div>
        <div class="gate-btn-container" id="btn-container">
            <div class="gate-btn" id="btn-me">_ SESSION: [비비]</div>
            <div class="gate-btn" id="btn-other">_ SESSION: [친구]</div>
        </div>
    </div>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('gate-loader');
            const btns = document.getElementById('btn-container');
            const meBtn = document.getElementById('btn-me');
            const otherBtn = document.getElementById('btn-other');

            setTimeout(() => { loader.innerText = "> ACCESS_GRANTED. CHOOSE SESSION..."; loader.style.opacity = "0.7"; }, 1200);
            setTimeout(() => { btns.style.opacity = '1'; }, 1800);

            // 세션 저장 키 이름 통일 (nya_current_session)
            const setSession = (type, name, icon) => {
                const sessionData = { type, name, icon };
                localStorage.setItem('nya_current_session', JSON.stringify(sessionData));
                window.location.href = 'main.html';
            };

            meBtn.addEventListener('click', () => setSession('me', '언재', '🐱'));
            otherBtn.addEventListener('click', () => setSession('other', '삐용', '🐰'));
        });
    </script>
</body>
</html>
</body>
</html>
