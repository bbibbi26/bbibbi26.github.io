<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냐/삐용 - HOME</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    
    <style>
        :root {
            --main-pink: #ff7eb9;
            --soft-pink: #ffe4f1;
            --accent-blue: #70d6ff;
            --font-main: 'GmarketSansBold', sans-serif;
            --font-light: 'GmarketSansLight', sans-serif;
        }

        body {
            background-color: var(--soft-pink);
            background-image: 
                radial-gradient(circle at 50% 50%, #ffffff 0%, #ffe4f1 100%),
                linear-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.5) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: var(--main-pink);
            font-family: var(--font-main);
            margin: 0; padding: 20px;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            overflow: hidden; /* 꽃가루가 화면 밖으로 나가지 않도록 설정 */
            position: relative; /* 자식 요소인 꽃가루의 기준점이 됨 */
        }

        /* --- 꽃가루 스타일 --- */
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fff; /* 꽃가루 색상 (흰색) */
            border-radius: 50%; /* 둥근 모양 */
            opacity: 0; /* 처음에는 안 보임 */
            animation: fall infinite linear; /* 떨어지는 애니메이션 */
        }

        @keyframes fall {
            0% {
                top: -10px; /* 화면 위에서 시작 */
                opacity: 1; /* 보이게 함 */
            }
            100% {
                top: 100vh; /* 화면 아래로 이동 */
                opacity: 0; /* 사라짐 */
            }
        }

        /* --- 공통 카드 스타일 --- */
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid transparent;
            border-radius: 50px 15px 50px 15px; 
            background-image: linear-gradient(rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.92)), 
                              linear-gradient(90deg, var(--main-pink), var(--accent-blue));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            box-shadow: 10px 10px 25px rgba(255, 126, 185, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative; /* 꽃가루보다 위에 표시되도록 설정 */
            z-index: 1; 
        }

        /* --- 전체 컨테이너 --- */
        .main-wrapper {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 25px;
            animation: slideUp 0.8s ease-out;
            position: relative; /* 꽃가루보다 위에 표시되도록 설정 */
            z-index: 1;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 사이드바 영역 --- */
        .sidebar {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-circle {
            width: 100px; height: 100px;
            background: var(--soft-pink);
            border-radius: 35px 10px 35px 10px;
            border: 2px solid var(--main-pink);
            margin-bottom: 20px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
            box-shadow: 0 5px 15px rgba(255, 126, 185, 0.2);
        }

        .menu-list { width: 100%; list-style: none; padding: 0; margin-top: 30px; }
        .menu-item {
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 15px 5px;
            cursor: pointer;
            font-family: var(--font-light);
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .menu-item:hover {
            background: var(--soft-pink);
            color: var(--main-pink);
            transform: translateX(10px);
        }

        /* --- 콘텐츠 영역 --- */
        .content-area {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 25px;
        }

        .top-banner {
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-banner h2 { font-size: 2rem; margin: 0; letter-spacing: 2px; }

        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .grid-item {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            cursor: pointer;
        }

        .grid-item:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 20px 40px rgba(255, 126, 185, 0.2);
        }

        .grid-item i { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        .grid-item span { font-size: 1.1rem; }

        .logout-link {
            margin-top: auto;
            font-family: var(--font-light);
            font-size: 0.8rem;
            opacity: 0.5;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-link:hover { opacity: 1; color: var(--accent-blue); }

        @media (max-width: 800px) {
            .main-wrapper { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="confetti-container"></div>

    <div class="main-wrapper">
        <aside class="sidebar glass-card">
            <div class="profile-circle">🐱</div>
            <div style="font-size: 1.4rem;">섹시코테</div>
            <div style="font-family: var(--font-light); font-size: 0.8rem; opacity: 0.7; margin-top: 5px;">NYA-PPI UNIT #01</div>
            
            <ul class="menu-list">
                <li class="menu-item">🎀 스타일 보관함</li>
                <li class="menu-item">💌 냥냥 메시지</li>
                <li class="menu-item">⚙️ 시스템 설정</li>
            </ul>

            <div class="logout-link" onclick="location.href='index.html'">LOGOUT_SESSION</div>
        </aside>

        <main class="content-area">
            <div class="top-banner glass-card">
                <div>
                    <h2>WELCOME BACK</h2>
                    <p style="font-family: var(--font-light); opacity: 0.8; margin-top: 10px;">시스템이 정상 가동 중입니다.</p>
                </div>
                <div style="font-size: 3rem;">💖</div>
            </div>

            <div class="grid-menu">
                <div class="grid-item glass-card">
                    <i>🐾</i>
                    <span>리포트</span>
                </div>
                <div class="grid-item glass-card">
                    <i>🥊</i>
                    <span>트레이닝</span>
                </div>
                <div class="grid-item glass-card">
                    <i>📸</i>
                    <span>갤러리</span>
                </div>
                <div class="grid-item glass-card">
                    <i>🔒</i>
                    <span>비밀공간</span>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 꽃가루 생성 함수
        function createConfetti() {
            const container = document.getElementById('confetti-container');
            const confetti = document.createElement('div');
            confetti.classList.add('confetti');

            // 랜덤한 위치, 크기, 애니메이션 속도 설정
            confetti.style.left = Math.random() * 100 + 'vw'; 
            confetti.style.width = Math.random() * 10 + 5 + 'px'; 
            confetti.style.height = confetti.style.width; 
            confetti.style.animationDuration = Math.random() * 3 + 2 + 's'; 

            container.appendChild(confetti);

            // 애니메이션이 끝나면 꽃가루 제거
            setTimeout(() => {
                confetti.remove();
            }, parseFloat(confetti.style.animationDuration) * 1000);
        }

        // 일정 시간마다 꽃가루 생성
        setInterval(createConfetti, 100); 
    </script>
</body>
</html>
