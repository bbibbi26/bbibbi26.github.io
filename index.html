<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>##냥냐/삐용</title>
    <style>
        body { font-family: sans-serif; background-color: #fce4ec; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; }
        input { padding: 10px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; width: 200px; }
        button { padding: 10px 25px; background-color: #f06292; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #ec407a; }
    </style>
    <script>
        function login() {
            var pw = document.getElementById("pw").value;
            if(pw === "1234") { 
                alert("반가워요! 캐릭터 페이지로 들어갑니다.");
                location.href = "main.html"; 
            } else { alert("비밀번호가 틀렸어요!"); }
        }
    </script>
</head>
<body>
    <div class="box">
        <h2>🔒 캐릭터 보관소</h2>
        <input type="password" id="pw" placeholder="비밀번호 입력"> <br>
        <button onclick="login()">입장하기</button>
    </div>
</body>
</html>
