<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYA-PPI / INTEGRATED_TERMINAL</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    
    <style>
        :root {
            --main-pink: #ff7eb9;
            --main-purple: #9d00ff;
            --dark-bg: #050508;
            --panel-bg: rgba(15, 15, 25, 0.85);
            --accent-blue: #00f3ff;
            --font-main: 'GmarketSansBold', sans-serif;
            --font-light: 'GmarketSansLight', sans-serif;
        }

        body {
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(157, 0, 255, 0.1) 0%, transparent 80%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            color: #fff;
            font-family: var(--font-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* --- [MODIFIED] 배경 여백 로그창 --- */
        .ambient-log-layer {
            position: fixed;
            bottom: 30px;
            left: 30px;
            width: 400px;
            height: auto;
            pointer-events: none; /* 클릭 방해 금지 */
            z-index: 1;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: var(--main-pink);
            opacity: 0.4; /* 배경처럼 은은하게 */
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .log-line {
            animation: logFadeIn 1s ease-out forwards;
            white-space: nowrap;
            text-shadow: 0 0 5px var(--main-pink);
        }

        @keyframes logFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- 메인 터미널 박스 --- */
        .terminal-frame {
            width: 85vw;
            height: 80vh;
            max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 126, 185, 0.3);
            border-radius: 60px 20px 60px 20px;
            backdrop-filter: blur(25px);
            display: flex;
            position: relative;
            z-index: 10; /* 로그보다 위에 위치 */
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .terminal-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: linear-gradient(90deg, transparent, var(--main-pink), var(--main-purple), transparent);
            box-shadow: 0 0 15px var(--main-pink);
        }

        /* 사이드바 */
        .sidebar {
            width: 280px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 40px;
            background: rgba(0, 0, 0, 0.3);
        }

        .profile-hex {
            width: 80px; height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--main-pink), var(--main-purple));
            border-radius: 25px 10px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem;
        }

        .nav-menu { list-style: none; padding: 0; margin-top: 30px; flex-grow: 1; }
        .nav-item {
            padding: 15px;
            margin-bottom: 8px;
            border-radius: 10px 20px;
            cursor: pointer;
            font-family: var(--font-light);
            color: rgba(255, 255, 255, 0.4);
            transition: 0.3s;
        }
        .nav-item:hover, .nav-item.active { color: var(--main-pink); background: rgba(255, 126, 185, 0.1); }

        /* 메인 콘텐츠 */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 50px;
        }

        .top-info {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 40px;
        }

        #current-time { font-size: 2.5rem; font-weight: bold; text-shadow: 0 0 10px var(--main-pink); }
        #current-date { font-size: 1rem; color: var(--accent-blue); opacity: 0.8; }

        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        .action-card {
            height: 150px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 30px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .action-card:hover { border-color: var(--main-pink); transform: translateY(-3px); }

        .disconnect-btn { margin-top: auto; font-family: var(--font-light); font-size: 0.8rem; color: rgba(255,255,255,0.2); cursor: pointer; text-align: right; }
        .disconnect-btn:hover { color: var(--main-pink); }

    </style>
</head>
<body>

    <div class="ambient-log-layer" id="ambient-logs">
        <div class="log-line">>> SYSTEM READY. INITIALIZING AMBIENT LOGS...</div>
    </div>

    <div class="terminal-frame">
        <aside class="sidebar">
            <div class="profile-hex">🐱</div>
            <div style="text-align: center;">
                <h3 style="margin: 0;">섹시코테</h3>
                <p style="font-size: 0.7rem; color: var(--accent-blue);">ADMIN_UNIT_01</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active">DASHBOARD</li>
                <li class="nav-item">WARDROBE</li>
                <li class="nav-item">MESSAGES</li>
                <li class="nav-item">CONTROL</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-info">
                <div>
                    <div id="current-date">LOADING...</div>
                    <div id="current-time">00:00:00</div>
                </div>
                <h2 style="margin: 0; letter-spacing: 2px; color: var(--main-pink);">CORE TERMINAL</h2>
            </div>

            <div class="action-grid">
                <div class="action-card"><span>📊</span><p>REPORT</p></div>
                <div class="action-card"><span>🎯</span><p>TRAINING</p></div>
                <div class="action-card"><span>🧬</span><p>GALLERY</p></div>
                <div class="action-card"><span>🔒</span><p>VAULT</p></div>
            </div>

            <div class="disconnect-btn" onclick="location.href='index.html'">TERMINATE_SESSION</div>
        </main>
    </div>

    <script>
        // 1. 실시간 시계
        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-GB');
            document.getElementById('current-date').textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 2. 여백 로그 시스템 (30초 간격)
        const logMessages = [
            "CHECKING CORE TEMPERATURE... NORMAL",
            "ENCRYPTED PACKETS RECEIVED FROM SECTOR-7",
            "NYA-PPI PROTOCOL VERSION 4.0 ACTIVE",
            "IDLE THREADS PURGED SUCCESSFULLY",
            "SECURITY FIREWALL: NO INTRUSIONS",
            "NEURAL LINK STABILITY: 98.4%",
            "CATNIP-LEVEL RESOURCE OPTIMIZED",
            "PUNCH_LOG_BACKUP COMPLETED",
            "AMBIENT PARTICLES SYNCED WITH GRID",
            "HEARTBEAT SIGNAL DETECTED"
        ];

        const logLayer = document.getElementById('ambient-logs');

        function addAmbientLog() {
            const msg = logMessages[Math.floor(Math.random() * logMessages.length)];
            const time = new Date().toLocaleTimeString('en-GB', { hour12: false, hour: '2-digit', minute: '2-digit' });
            
            const logLine = document.createElement('div');
            logLine.className = 'log-line';
            logLine.textContent = `[${time}] ${msg}`;
            
            logLayer.appendChild(logLine);

            // 여백이 너무 차지하지 않게 최대 5줄 유지
            if (logLayer.childNodes.length > 5) {
                logLayer.removeChild(logLayer.firstChild);
            }
        }

        // 30초(30000ms)마다 로그 생성
        setInterval(addAmbientLog, 30000); 
        addAmbientLog(); // 초기 실행
    </script>
</body>
</html>
