<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYA-PPI / INTRO_GATE</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #2e303d; /* 더 어두운 회색 */
            --frame-color: #3b3e4f;
            --main-pink: #ff98c1; /* 더 화사한 핑크 */
            --main-purple: #9d7cff; /* 더 화사한 보라색 */
            --accent-blue: #70d6ff;
            --text-color: rgba(255, 255, 255, 0.85);
            --font-main: 'GmarketSansBold', sans-serif;
            --font-light: 'GmarketSansLight', sans-serif;
        }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-color); color: var(--text-color); font-family: var(--font-main); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .gate-frame { width: 320px; text-align: center; }
        .logo-area { font-size: 1.2rem; text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); margin-bottom: 20px; }
        .logo-sub { font-size: 0.6rem; opacity: 0.5; margin-top: 5px; }
        #gate-loader { font-family: 'Courier New', monospace; font-size: 11px; color: var(--accent-blue); }
        .gate-btn-container { display: flex; flex-direction: column; gap: 15px; width: 220px; margin: 0 auto; opacity: 0; transition: opacity 0.5s ease-in; }
        .gate-btn { padding: 12px 10px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 0.75rem; text-transform: uppercase; cursor: pointer; color: var(--text-color); font-family: var(--font-main); letter-spacing: 1px; transition: 0.3s; position: relative; }
        .gate-btn:before { content: ""; position: absolute; top: 0; left: 0; width: 0; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05)); transition: 0.3s; }
        .gate-btn:hover:before { width: 100%; }
        #btn-me { border-color: rgba(255, 126, 185, 0.2); }
        #btn-me:hover { border-color: var(--main-pink); box-shadow: 0 0 15px rgba(255, 126, 185, 0.4); text-shadow: 0 0 5px var(--main-pink); }
        #btn-other { border-color: rgba(0, 198, 255, 0.2); }
        #btn-other:hover { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0, 198, 255, 0.4); text-shadow: 0 0 5px var(--accent-blue); }
    </style>
</head>
<body>
    <div class="gate-frame">
        <div class="logo-area">
            <div>Nya-Ppi</div>
            <div class="logo-sub">> INTRO_CONNECTION_HUB_V1.1</div>
        </div>
        <div id="gate-loader">CONNECTING_TO_DATABASE...</div>
        <div class="gate-btn-container" id="btn-container">
            <div class="gate-btn" id="btn-me">_ SESSION ID 01: [비비]</div>
            <div class="gate-btn" id="btn-other">_ SESSION ID 02: [친구]</div>
        </div>
    </div>
    <script>
        window.addEventListener('load', () => {
            const loader = document.getElementById('gate-loader');
            const btns = document.getElementById('btn-container');
            const meBtn = document.getElementById('btn-me');
            const otherBtn = document.getElementById('btn-other');

            // 로딩 애니메이션 (단순화)
            setTimeout(() => { loader.innerText = "> ACCESS_GRANTED. CHOOSE SESSION..."; loader.style.opacity = "0.7"; }, 1500);
            setTimeout(() => { btns.style.opacity = '1'; }, 2000);

            // 세션 선택 및 main.html로 이동
            const setSession = (type, name) => {
                const sessionData = { type, name, icon: '👤' };
                localStorage.setItem('nya_current_session', JSON.stringify(sessionData));
                location.href = 'main.html';
            };

            meBtn.addEventListener('click', () => setSession('me', '비비'));
            otherBtn.addEventListener('click', () => setSession('other', '친구'));
        });
    </script>
</body>
</html>
</body>
</html>
