<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYA-PPI / INTEGRATED_TERMINAL</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    
    <style>
        :root {
            --main-pink: #ff7eb9;
            --main-purple: #9d00ff;
            --dark-bg: #050508;
            --panel-bg: rgba(15, 15, 25, 0.9);
            --bubble-me: rgba(255, 126, 185, 0.15); /* 내 말풍선 */
            --bubble-other: rgba(255, 255, 255, 0.05); /* 상대 말풍선 */
            --accent-blue: #00f3ff;
            --font-main: 'GmarketSansBold', sans-serif;
            --font-light: 'GmarketSansLight', sans-serif;
        }

        body {
            background-color: #fce4ec;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(112, 214, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 126, 185, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #f5f7fa 0%, #ffe4f1 50%, #e0f7ff 100%),
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #fff; font-family: var(--font-main);
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        .terminal-frame {
            width: 85vw; height: 80vh; max-width: 1000px;
            position: relative; z-index: 10;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.3));
            animation: terminalScanOpen 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        .terminal-frame::before {
            content: "INTEGRATED TERMINAL";
            position: absolute; top: -35px; left: 0;
            width: 220px; height: 40px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: none;
            border-radius: 15px 15px 0 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; letter-spacing: 1px; color: var(--accent-blue);
            backdrop-filter: blur(25px);
        }

        .content-wrapper {
            width: 100%; height: 100%;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0 30px 30px 30px;
            backdrop-filter: blur(25px);
            display: flex; overflow: hidden;
        }

        @keyframes terminalScanOpen {
            0% { transform: translateY(20px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .sidebar {
            width: 240px; border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; padding: 40px; background: rgba(0, 0, 0, 0.2);
        }

        #session-icon {
            width:60px; height:60px; margin-bottom:20px; 
            border-radius:15px; display:flex; align-items:center; 
            justify-content:center; font-size:1.5rem;
        }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 40px; overflow: hidden; }

        .system-board { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

        .post-list { 
            list-style: none; padding: 5px; margin: 0; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 12px;
            scroll-behavior: smooth;
        }

        .post-item {
            max-width: 75%; padding: 12px 18px; position: relative;
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        .post-item.other {
            align-self: flex-start; background: var(--bubble-other);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 4px 18px 18px 18px;
        }

        .post-item.me {
            align-self: flex-end; background: var(--bubble-me);
            border: 1px solid rgba(255, 126, 185, 0.3); border-radius: 18px 4px 18px 18px;
        }

        .post-sender { font-size: 0.6rem; opacity: 0.5; margin-bottom: 4px; }
        .me .post-sender { text-align: right; }
        .post-text { font-family: var(--font-light); font-size: 0.9rem; color: #eee; line-height: 1.5; }
        
        .post-info {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 8px; font-size: 0.65rem; color: rgba(255, 255, 255, 0.3);
        }
        .me .post-info { flex-direction: row-reverse; }

        .del-btn { cursor: pointer; color: var(--main-pink); opacity: 0.5; margin: 0 10px; }
        .del-btn:hover { opacity: 1; }

        .input-area { display: flex; gap: 10px; margin-top: 25px; }
        #comment-input {
            flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; padding: 15px; color: #fff; font-family: var(--font-light); outline: none;
            transition: 0.3s;
        }
        #comment-input:focus { border-color: var(--main-pink); background: rgba(255, 255, 255, 0.08); }
        
        .save-btn {
            background: linear-gradient(135deg, var(--main-pink), var(--main-purple));
            border: none; color: #fff; padding: 0 25px; border-radius: 15px;
            cursor: pointer; font-family: var(--font-main); font-size: 0.8rem;
        }

        .disconnect-btn { margin-top: 20px; font-size: 0.7rem; color: rgba(255,255,255,0.2); cursor: pointer; text-align: right; }
        .post-list::-webkit-scrollbar { width: 4px; }
        .post-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        #boot-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050508; z-index: 9999; display: flex;
            justify-content: center; align-items: center;
            font-family: 'Courier New', monospace; color: var(--main-pink);
            transition: opacity 0.5s ease;
        }

        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <div id="boot-loader"><div id="loader-text">> INITIALIZING_SECURE_SESSION...</div></div>

    <div class="terminal-frame">
        <div class="content-wrapper">
            <aside class="sidebar">
                <div id="session-icon"></div>
                <h3 id="session-name" style="margin: 0; font-size: 1rem;"></h3>
                <p id="session-status" style="font-size: 0.6rem; color: var(--accent-blue); margin-bottom:30px;">STATUS: ONLINE</p>
                <div style="font-size: 0.7rem; color:rgba(255,255,255,0.4); line-height:2;">
                    > DASHBOARD<br>
                    > STORAGE<br>
                    > NETWORK
                </div>
            </aside>

            <main class="main-content">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:30px;">
                    <div>
                        <div id="current-date" style="font-size: 0.7rem; color: var(--accent-blue);">DATE</div>
                        <div id="current-time" style="font-size: 1.8rem; font-weight: bold;">00:00:00</div>
                    </div>
                    <div id="post-count" style="font-size: 0.7rem; opacity: 0.5;">MEMORIES: 00</div>
                </div>

                <section class="system-board">
                    <ul class="post-list" id="post-list"></ul>
                    
                    <div style="flex:1;"></div> 

                    <div class="input-area">
                        <input type="text" id="comment-input" placeholder="여기에 기록을 남겨주세요..." maxlength="50">
                        <button class="save-btn" onclick="saveComment()">SAVE</button>
                    </div>
                </section>

                <div class="disconnect-btn" onclick="location.href='index.html'">TERMINATE_SESSION_</div>
            </main>
        </div>
    </div>

    <script>
        // 1. 세션 정보 불러오기
        const session = JSON.parse(localStorage.getItem('nya_current_session'));
        if (!session) { location.href = 'index.html'; }

        // 2. 초기화 및 실시간 리스너 추가
        window.addEventListener('load', () => {
            const iconBox = document.getElementById('session-icon');
            iconBox.innerText = session.icon;
            iconBox.style.background = (session.type === 'me') ? 
                'linear-gradient(135deg, var(--main-pink), var(--main-purple))' : 
                'linear-gradient(135deg, #00c6ff, #0072ff)';
            document.getElementById('session-name').innerText = session.name;

            setTimeout(() => {
                document.getElementById('boot-loader').style.opacity = "0";
                setTimeout(() => document.getElementById('boot-loader').remove(), 500);
            }, 800);
            renderComments();
        });

        // ✨ 실시간 동기화 핵심: 다른 창에서 데이터가 변하면 즉시 리렌더링
        window.addEventListener('storage', (e) => {
            if (e.key === 'nya_chat_history') {
                renderComments();
            }
        });

        const commentInput = document.getElementById('comment-input');
        const postList = document.getElementById('post-list');

        // 3. 코멘트 저장
        function saveComment() {
            const text = commentInput.value.trim();
            if (!text) return;

            const newPost = { 
                id: Date.now(), 
                senderType: session.type, 
                senderName: session.name,
                content: text, 
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) 
            };

            const comments = JSON.parse(localStorage.getItem('nya_chat_history') || '[]');
            comments.push(newPost); 
            localStorage.setItem('nya_chat_history', JSON.stringify(comments));
            
            commentInput.value = '';
            renderComments(); // 내 화면 업데이트
        }

        // 4. 코멘트 렌더링 (좌우 배치 로직)
        function renderComments() {
            const comments = JSON.parse(localStorage.getItem('nya_chat_history') || '[]');
            postList.innerHTML = '';
            document.getElementById('post-count').innerText = `MEMORIES: ${String(comments.length).padStart(2, '0')}`;
            
            comments.forEach(post => {
                const li = document.createElement('li');
                const alignClass = (post.senderType === session.type) ? 'me' : 'other';
                
                li.className = `post-item ${alignClass}`;
                li.innerHTML = `
                    <div class="post-sender">${post.senderName}</div>
                    <div class="post-text">${post.content}</div>
                    <div class="post-info">
                        <span>${post.time}</span>
                        <span class="del-btn" onclick="deleteComment(${post.id})">DELETE</span>
                    </div>
                `;
                postList.appendChild(li);
            });
            postList.scrollTop = postList.scrollHeight;
        }

        function deleteComment(id) {
            let comments = JSON.parse(localStorage.getItem('nya_chat_history') || '[]');
            comments = comments.filter(c => c.id !== id);
            localStorage.setItem('nya_chat_history', JSON.stringify(comments));
            renderComments();
        }

        commentInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') saveComment(); });

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-GB');
            document.getElementById('current-date').textContent = now.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000); 
        updateClock();
    </script>
</body>
</html>
