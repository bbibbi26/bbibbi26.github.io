<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>냥냐/삐용</title> <style>
        :root {
            --neon-red: #ff003c;
            --neon-blue: #00f3ff;
            --bg-black: #0a0a0a;
        }

        body {
            background-color: var(--bg-black);
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0505 0%, #0a0a0a 100%),
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%),
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 100%, 100% 4px, 4px 100%;
            color: white;
            font-family: 'Share Tech Mono', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .login-frame {
            position: relative;
            width: 400px;
            padding: 40px;
            background: rgba(20, 0, 0, 0.7);
            border: 1px solid var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 0, 60, 0.4);
            text-align: center;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--neon-red);
            box-shadow: 0 0 15px var(--neon-red);
        }

        h1 {
            font-size: 2.5rem; /* 크기를 조금 키웠어요 */
            letter-spacing: 10px;
            color: var(--neon-red);
            text-transform: uppercase;
            margin-bottom: 35px;
            text-shadow: 0 0 10px var(--neon-red), 2px 2px #000;
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            1% { transform: skew(10deg); opacity: 0.8; }
            2% { transform: skew(-10deg); opacity: 1; }
            3% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #555;
            padding: 15px;
            color: var(--neon-blue);
            font-size: 1.2rem;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
            text-align: center;
        }

        input:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--neon-red);
            color: var(--neon-red);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 5px;
        }

        button:hover {
            background: var(--neon-red);
            color: black;
            box-shadow: 0 0 25px var(--neon-red);
        }

        .status {
            font-size: 0.7rem;
            color: #444;
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
        }
    </style>
    <script>
        function accessCheck() {
            const code = document.getElementById('passcode').value;
            if(code === "1234") {
                alert("접속 허가됨. 데이터를 불러옵니다...");
                location.href = "main.html";
            } else {
                alert("접근 거부: 비밀번호가 일치하지 않습니다.");
            }
        }
    </script>
</head>
<body>

    <div class="login-frame">
        <div class="top-bar"></div>
        <h1>냥뿅</h1> <div class="input-group">
            <input type="password" id="passcode" placeholder="[ PASSCODE ]">
        </div>
        
        <button onclick="accessCheck()">INITIALIZE LOGIN</button>

        <div class="status">
            <span>NYANG-PONG SYSTEM v1.0</span>
            <span>SECURE_LINK: ACTIVE</span>
        </div>
    </div>

</body>
</html>
