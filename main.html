<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYA-PPI / INTEGRATED_TERMINAL</title>
    <link href="https://webfontworld.github.io/gmarket/GmarketSans.css" rel="stylesheet">
    
    <style>
        :root {
            --main-pink: #ff7eb9;
            --main-purple: #9d00ff;
            --dark-bg: #050508;
            --panel-bg: rgba(15, 15, 25, 0.9);
            --accent-blue: #00f3ff;
            --font-main: 'GmarketSansBold', sans-serif;
            --font-light: 'GmarketSansLight', sans-serif;
        }

        body {
            background-color: #fce4ec;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(112, 214, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(255, 126, 185, 0.15) 0%, transparent 50%),
                linear-gradient(135deg, #f5f7fa 0%, #ffe4f1 50%, #e0f7ff 100%),
                linear-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.4) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 100% 100%, 40px 40px, 40px 40px;
            color: #fff;
            font-family: var(--font-main);
            margin: 0; display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden;
        }

        #boot-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #050508; z-index: 9999; display: flex;
            justify-content: center; align-items: center;
            font-family: 'Courier New', monospace; color: var(--main-pink);
            transition: opacity 0.5s ease;
        }

        .ambient-log-layer {
            position: fixed; bottom: 30px; left: 30px; width: 400px;
            height: auto; pointer-events: none; z-index: 1;
            font-family: 'Courier New', monospace; font-size: 0.75rem;
            color: var(--main-pink); opacity: 0.4; display: flex;
            flex-direction: column; gap: 5px;
        }

        .terminal-frame {
            width: 85vw; height: 85vh; max-width: 1100px;
            background: var(--panel-bg);
            border: 1px solid rgba(255, 126, 185, 0.3);
            border-radius: 60px 20px 60px 20px;
            backdrop-filter: blur(25px);
            display: flex; position: relative; z-index: 10;
            box-shadow: 0 20px 60px rgba(255, 126, 185, 0.2);
            overflow: hidden;
            animation: terminalScanOpen 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        @keyframes terminalScanOpen {
            0% { transform: scaleY(0); opacity: 0; }
            40% { transform: scaleY(0.005); opacity: 1; background: var(--main-pink); }
            100% { transform: scaleY(1); opacity: 1; }
        }

        .sidebar {
            width: 260px; border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; padding: 40px; background: rgba(0, 0, 0, 0.3);
        }

        .profile-hex {
            width: 70px; height: 70px; margin: 0 auto 15px;
            background: linear-gradient(135deg, var(--main-pink), var(--main-purple));
            border-radius: 20px 8px; display: flex; justify-content: center; align-items: center; font-size: 2rem;
        }

        .nav-menu { list-style: none; padding: 0; margin-top: 20px; flex-grow: 1; }
        .nav-item {
            padding: 12px; margin-bottom: 5px; border-radius: 10px 15px;
            cursor: pointer; font-family: var(--font-light); color: rgba(255, 255, 255, 0.4); font-size: 0.85rem;
        }
        .nav-item.active { color: var(--main-pink); background: rgba(255, 126, 185, 0.1); }

        .main-content { flex: 1; display: flex; flex-direction: column; padding: 40px; overflow: hidden; justify-content: flex-start; }

        /* --- [게시판 디자인 수정본] --- */
        .system-board {
            height: 55%; /* 크기 축소 */
            background: rgba(0, 0, 0, 0.2); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; /* 모서리 대칭 통일 */
            padding: 25px; 
            display: flex; 
            flex-direction: column;
            margin-bottom: 40px; /* 하단 공간 확보 */
            animation: fadeInBoard 1s ease-out 1.2s both;
        }

        .board-header { 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--main-pink); padding-bottom: 10px; margin-bottom: 15px;
        }
        
        .input-area { display: flex; gap: 10px; margin-bottom: 20px; }
        #comment-input {
            flex: 1; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px; /* 모서리 통일 */
            padding: 12px; color: #fff; font-family: var(--font-light); outline: none;
        }
        #comment-input:focus { border-color: var(--main-pink); }
        
        .save-btn {
            background: var(--main-pink); border: none; color: #fff; padding: 0 20px;
            border-radius: 12px; /* 모서리 통일 */
            cursor: pointer; font-family: var(--font-main); transition: 0.3s;
        }
        .save-btn:hover { background: var(--main-purple); transform: scale(1.05); }

        .post-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
        .post-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: var(--font-light); font-size: 0.9rem; animation: slideIn 0.3s ease-out;
        }
        .post-text { flex: 1; color: #eee; }
        .post-date { font-size: 0.7rem; color: var(--accent-blue); margin: 0 15px; }
        .del-btn { color: #ff4d4d; cursor: pointer; font-size: 0.7rem; opacity: 0.5; }
        .del-btn:hover { opacity: 1; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes fadeInBoard { from { opacity: 0; } to { opacity: 1; } }

        .disconnect-btn { margin-top: auto; font-size: 0.75rem; color: rgba(255,255,255,0.2); cursor: pointer; text-align: right; }
        
        .post-list::-webkit-scrollbar { width: 4px; }
        .post-list::-webkit-scrollbar-thumb { background: var(--main-pink); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="boot-loader"><div id="loader-text">> AUTHENTICATING...</div></div>
    <div class="ambient-log-layer" id="ambient-logs"></div>

    <div class="terminal-frame">
        <aside class="sidebar">
            <div class="profile-hex">🐱</div>
            <div style="text-align: center;">
                <h3 style="margin: 0; font-size: 1.1rem;">냥냥펀치</h3>
                <p style="font-size: 0.6rem; color: var(--accent-blue); letter-spacing: 1px;">ADMIN_UNIT_01</p>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active">DASHBOARD</li>
                <li class="nav-item">WARDROBE</li>
                <li class="nav-item">MESSAGES</li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-info" style="margin-bottom: 20px;">
                <div>
                    <div id="current-date" style="font-size: 0.8rem; color: var(--accent-blue);">DATE</div>
                    <div id="current-time" style="font-size: 2rem; font-weight: bold; color: #fff;">00:00:00</div>
                </div>
                <h2 style="color: var(--main-pink); margin: 0; letter-spacing: 2px;">CORE_SYSTEM</h2>
            </div>

            <section class="system-board">
                <div class="board-header">
                    <strong>SYSTEM_COMMENTS</strong>
                    <span id="post-count" style="font-size: 0.7rem; color: var(--accent-blue);">POSTS: 0</span>
                </div>
                
                <div class="input-area">
                    <input type="text" id="comment-input" placeholder="새로운 코멘트를 입력하세요..." maxlength="50">
                    <button class="save-btn" onclick="saveComment()">SAVE</button>
                </div>

                <ul class="post-list" id="post-list"></ul>
            </section>

            <div class="disconnect-btn" onclick="location.href='index.html'">TERMINATE_SESSION >></div>
        </main>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader-text').innerHTML = "> ACCESS GRANTED.";
                document.getElementById('loader-text').style.color = "var(--accent-blue)";
                setTimeout(() => {
                    document.getElementById('boot-loader').style.opacity = "0";
                    setTimeout(() => document.getElementById('boot-loader').remove(), 500);
                }, 400);
            }, 600);
            loadComments();
        });

        const commentInput = document.getElementById('comment-input');
        const postList = document.getElementById('post-list');
        const postCount = document.getElementById('post-count');

        function saveComment() {
            const text = commentInput.value.trim();
            if (!text) return;
            const newPost = { id: Date.now(), content: text, date: new Date().toLocaleDateString('ko-KR') };
            const comments = JSON.parse(localStorage.getItem('nya_comments') || '[]');
            comments.unshift(newPost);
            localStorage.setItem('nya_comments', JSON.stringify(comments));
            commentInput.value = '';
            renderComments();
        }

        function renderComments() {
            const comments = JSON.parse(localStorage.getItem('nya_comments') || '[]');
            postList.innerHTML = '';
            postCount.innerText = `POSTS: ${String(comments.length).padStart(2, '0')}`;
            comments.forEach(post => {
                const li = document.createElement('li');
                li.className = 'post-item';
                li.innerHTML = `
                    <span class="post-text">${post.content}</span>
                    <span class="post-date">${post.date}</span>
                    <span class="del-btn" onclick="deleteComment(${post.id})">DELETE</span>
                `;
                postList.appendChild(li);
            });
        }

        function deleteComment(id) {
            let comments = JSON.parse(localStorage.getItem('nya_comments') || '[]');
            comments = comments.filter(c => c.id !== id);
            localStorage.setItem('nya_comments', JSON.stringify(comments));
            renderComments();
        }

        function loadComments() { renderComments(); }
        commentInput.addEventListener('keypress', (e) => { if(e.key === 'Enter') saveComment(); });

        function updateClock() {
            const now = new Date();
            document.getElementById('current-time').textContent = now.toLocaleTimeString('en-GB');
            document.getElementById('current-date').textContent = now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
        }
        setInterval(updateClock, 1000); updateClock();

        const logLayer = document.getElementById('ambient-logs');
        function addLog() {
            const logs = ["SYNCING...", "ENCRYPTED", "STABLE", "BACKUP_OK"];
            const line = document.createElement('div');
            line.className = 'log-line';
            line.textContent = `[${new Date().toLocaleTimeString()}] ${logs[Math.floor(Math.random()*logs.length)]}`;
            logLayer.appendChild(line);
            if(logLayer.childNodes.length > 5) logLayer.removeChild(logLayer.firstChild);
        }
        setInterval(addLog, 30000); addLog();
    </script>
</body>
</html>
